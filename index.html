<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太鼓の達人 設置店舗マップ</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>

<style>
html, body {
  height: 100%;
  margin: 0;
}
#map {
  width: 100%;
  height: 100%;
}

#searchBox {
  width: 100%;
  padding: 4px 12px 4px 6px;
  box-sizing: border-box;
}

#controls {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 1000;
  background: white;
  padding: 8px 10px;
  border-radius: 6px;
  box-shadow: 0 2px 6px rgba(0,0,0,.2);
  font-size: 13px;
}

#controls button {
  margin: 2px 4px 4px 0;
  padding: 2px 6px;
  font-size: 12px;
}

#stats {
  margin-top: 6px;
  font-weight: bold;
}

.mobile-only {
  display: none;
}

.update-list {
  display: none;
  margin-left: 8px;
}
.update-toggle {
  cursor: pointer;
  color: #007bff;
  font-size: 12px;
  margin: 4px 0;
}

#updateNotice {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 1200;
  width: 300px;
  box-sizing: border-box;
  color: #243247;
  background: #fff;
  border: 1px solid #dce3eb;
  border-radius: 12px;
  padding: 14px;
  font: 13px/1.6 system-ui, sans-serif;
  box-shadow: 0 3px 14px rgba(24, 39, 60, .16);
  max-height: calc(100dvh - 100px);
  overflow-y: auto;
}
.update-heading { margin: 0 0 10px; font-size: 14px; font-weight: 700; }
.update-meta { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 5px 10px; margin: 0; }
.update-meta dt { color: #64748b; }
.update-meta dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
#fetchStatus:not(:empty) { margin-top: 8px; padding: 6px 8px; border-radius: 6px; background: #fff4d6; color: #785000; }
#summaryDate { margin-top: 12px; color: #64748b; font-size: 12px; }
#updateSummary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 5px; }
.update-count { padding: 6px 2px; background: #f1f5f9; border-radius: 7px; text-align: center; font-size: 11px; }
.update-count b { display: block; color: #243247; font-size: 19px; line-height: 1.35; font-variant-numeric: tabular-nums; }
.update-count.added { background: #edf8f0; color: #237644; }
.update-count.removed { background: #fff0f0; color: #a13c3c; }
.update-count.changed { background: #fff5e6; color: #945908; }
.update-more { margin-top: 12px; border-top: 1px solid #e2e8f0; padding-top: 9px; }
.update-more > summary { cursor: pointer; color: #365e88; font-weight: 600; }
#updateToggle { width: 100%; margin-top: 10px; padding: 8px; border: 1px solid #cbd8e6; border-radius: 7px; background: #f5f9ff; color: #24558b; font: inherit; cursor: pointer; }
#updateToggle:hover { background: #eaf2fd; }
#updateToggle:focus-visible, .update-more > summary:focus-visible { outline: 2px solid #2563eb; outline-offset: 3px; }
#updateHistory { margin-top: 12px; }
#updateHistory select { width: 100%; box-sizing: border-box; padding: 7px 8px; border: 1px solid #cbd5e1; border-radius: 6px; background: white; color: #243247; font: inherit; }

@media (max-width: 768px) {

  #controls {
    display: none;
    position: fixed;          /* ← absolute → fixed に変更 */
    top: 60px;
    left: 10px;               /* ← 左固定 */
    width: 260px;             /* ← 固定幅にする */
    
    max-height: 70vh;
    overflow-y: auto;

    z-index: 1100;

    background: white;
    border-radius: 10px;
    box-shadow: 0 4px 12px rgba(0,0,0,.25);
    padding: 12px;
  }

  #updateNotice {
    position: fixed;
    width: min(280px, calc(100vw - 106px));
    padding: 11px;
    font-size: 12px;
  }
  .update-meta { grid-template-columns: 54px minmax(0, 1fr); gap: 5px 7px; }
  .update-count b { font-size: 17px; }

  #updateDetails {
    margin-top: 8px;
    max-height: 40vh;
    overflow-y: auto;
  }

  .mobile-only {
    display: block;
    position: fixed;          /* absolute → fixed */
    top: 10px;
    left: 10px;
    z-index: 1300;

    padding: 6px 10px;
    background: white;
    border-radius: 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,.3);
  }
}

/* ========================= */
/* 更新モーダル（暗転） */
/* ========================= */
#updateModal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 3000;
}

/* モーダル中身カード */
#updateModalContent {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 90%;
  max-width: 640px;
  max-height: 80vh;
  overflow-y: auto;

  background: white;
  padding: 20px;
  border-radius: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,.35);
}

/* 閉じるボタン */
#closeModal {
  position: absolute;
  top: 10px;
  right: 14px;
  cursor: pointer;
  font-size: 18px;
  font-weight: bold;
}

</style>
</head>

<body>

<button id="toggleControls" class="mobile-only">
  フィルタ
</button>
<div id="controls">
  <input
    type="text"
    id="searchBox"
    placeholder="店舗名で検索"
    style="width: 100%; margin-bottom: 6px; padding: 4px;"
  >

  <strong>台数フィルタ</strong><br>

  <button id="selectAll">全選択</button>
  <button id="clearAll">全解除</button>
  <br><br>

  <label><input type="checkbox" class="machineFilter" value="1"> 1台</label><br>
  <label><input type="checkbox" class="machineFilter" value="2"> 2台</label><br>
  <label><input type="checkbox" class="machineFilter" value="3"> 3台</label><br>
  <label><input type="checkbox" class="machineFilter" value="4"> 4台</label><br>
  <label><input type="checkbox" class="machineFilter" value="5"> 5台</label><br>
  <label><input type="checkbox" class="machineFilter" value="6-7"> 6–7台</label><br>
  <label><input type="checkbox" class="machineFilter" value="8-9"> 8–9台</label><br>
  <label><input type="checkbox" class="machineFilter" value="10+"> 10台以上</label>

  <div id="stats"></div>

  <hr>
  <strong>都道府県</strong><br>

  <select id="prefFilter">
    <option value="ALL">すべて</option>
  </select>
</div>

<aside id="updateNotice" style="display:none;" aria-label="店舗データの更新状況">
  <h2 class="update-heading">更新状況</h2>
  <dl class="update-meta">
    <dt>最終取得</dt><dd id="lastFetched"></dd>
    <dt>最終変更</dt><dd id="lastChanged"></dd>
  </dl>
  <div id="fetchStatus" role="status"></div>
  <div id="summaryDate"></div>
  <div id="updateSummary"></div>
  <details class="update-more">
    <summary>詳細・過去の履歴</summary>
    <button type="button" id="updateToggle">変更内容を見る</button>
    <div id="updateDetails" hidden></div>
    <div id="updateHistory"></div>
  </details>
</aside>

<div id="updateModal">
  <div id="updateModalContent">
    <div id="closeModal">✕</div>
    <div id="modalDetails"></div>
  </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script src="map.js"></script>

</body>
</html>
